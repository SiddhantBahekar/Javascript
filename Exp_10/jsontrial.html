<!DOCTYPE html>
<html>

<head>
    <title>JSON Data Viewer</title>

    <!-- jQuery Library -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
</head>

<body>

    <h2>JSON Data Viewer</h2>

    <button onclick="loadFetchData()">
        Load using fetch()
    </button>

    <button onclick="loadJQueryData()">
        Load using $.getJSON()
    </button>

    <br><br>

    <table border="1">
        <thead>
            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Email</th>
                <th>City</th>
            </tr>
        </thead>

        <tbody id="tableBody"></tbody>
    </table>

    <script>

        // Display JSON data in table
        function displayData(users) {

            let output = "";

            users.forEach(user => {
                output += `
                    <tr>
                        <td>${user.id}</td>
                        <td>${user.name}</td>
                        <td>${user.email}</td>
                        <td>${user.address.city}</td>
                    </tr>
                `;
            });

            document.getElementById("tableBody").innerHTML = output;
        }

        // Load data using fetch()
        function loadFetchData() {

            fetch("https://jsonplaceholder.typicode.com/users")
                .then(response => response.json())
                .then(data => displayData(data))
                .catch(error => alert("Error: " + error));

        }

        // Load data using jQuery
        function loadJQueryData() {

            $.getJSON(
                "https://jsonplaceholder.typicode.com/users",
                function (data) {
                    displayData(data);
                }
            );

        }

    </script>

</body>

</html>
